name: Daily Pipeline Run

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:      # Manual trigger via Actions tab

jobs:
  run-pipeline:
    name: Run Career Data Pipeline
    runs-on: windows-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run pipeline
        run: python -m scraper.run_pipeline_new
        env:
          PYTHONPATH: ${{ github.workspace }}
          SCRAPER_LOG_LEVEL: INFO

      - name: Upload pipeline outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-output-${{ github.run_number }}
          path: scraper/output/
          retention-days: 7

      - name: Upload run logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-logs-${{ github.run_number }}
          path: scraper/run_logs/
          retention-days: 7